# ---------------------------------------------------------------------------
# Configuración del relay nostr-rs-relay
# Se monta dentro del contenedor en /usr/src/app/config.toml
# ---------------------------------------------------------------------------

[info]
# URL con la que el relay se anuncia a los clientes.
# Como el cliente corre en el navegador de la máquina anfitriona,
# la URL válida es la del puerto publicado en el host.
relay_url = "ws://localhost:8080/"

# Nombre corto del relay.
name = "relay-docker-TitanBestia"

# >>> ESTA ES LA EVIDENCIA DE LA PRÁCTICA <<<
# Debe decir exactamente: Relay local de practica para Docker - USUARIO
description = "Relay local de practica para Docker - TitanBestia"

# Opcionales (podés dejarlos comentados)
# pubkey = ""
# contact = "mailto:vos@ejemplo.com"

[database]
# Directorio donde el relay guarda la base SQLite dentro del contenedor.
data_directory = "/usr/src/app/db"

[network]
# Escuchar en todas las interfaces: si se bindea a 127.0.0.1 el puerto
# publicado hacia el host no responde.
address = "0.0.0.0"
port = 8080

[limits]
# Límites laxos, es un relay local de práctica.
messages_per_sec = 10
max_event_bytes = 131072
max_ws_message_bytes = 131072
max_ws_frame_bytes = 131072

[verified_users]
mode = "disabled"
